  <circle cx="95" cy="44" r="4.5" fill="#818cf8"/>
  <circle cx="95" cy="84" r="4.5" fill="#34d399"/>
  <circle cx="64" cy="102" r="4.5" fill="#38bdf8"/>
  <circle cx="33" cy="84" r="4.5" fill="#818cf8"/>
  <circle cx="33" cy="44" r="4.5" fill="#34d399"/>
